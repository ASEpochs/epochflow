services:
  - type: web
    name: epochflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-free.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: STORAGE_MODE
        value: memory
      - key: PROMETHEUS_PORT
        value: "0"
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ANTHROPIC_MODEL
        value: deepseek-ai/DeepSeek-V3.2
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        value: https://api.siliconflow.cn
  - type: web
    name: epochflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_PYTHON_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
