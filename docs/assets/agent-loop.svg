<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EpochFlow Agent execution loop</title>
  <desc id="desc">A traceable loop from understanding and routing through capability assembly, action, response composition, and observation and evaluation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4faf7"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#163d32" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#5b7a70"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="56" y="58" fill="#173f34" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">One request, a traceable Agent loop</text>
  <text x="56" y="88" fill="#60726c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Every stage returns evidence that can be inspected, tested, and improved.</text>

  <g stroke="#5b7a70" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M214 190H238"/>
    <path d="M402 190H426"/>
    <path d="M590 190H614"/>
    <path d="M778 190H802"/>
    <path d="M966 190H990"/>
    <path d="M1072 267C1052 328 170 328 142 267" stroke-dasharray="7 7"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(50 126)">
      <rect width="164" height="140" rx="18" fill="#ffffff" stroke="#c7ddd4"/>
      <circle cx="82" cy="42" r="23" fill="#dff2e9"/>
      <circle cx="78" cy="38" r="9" fill="none" stroke="#28745b" stroke-width="3"/>
      <path d="M85 45l9 9" stroke="#28745b" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="91" text-anchor="middle" fill="#173f34" font-size="18" font-weight="700">Understand</text>
      <text x="82" y="116" text-anchor="middle" fill="#67766f" font-size="13">intent · entities</text>
    </g>
    <g transform="translate(238 126)">
      <rect width="164" height="140" rx="18" fill="#ffffff" stroke="#c7ddd4"/>
      <circle cx="82" cy="42" r="23" fill="#e7edfa"/>
      <circle cx="70" cy="34" r="4" fill="#4f6fa8"/><circle cx="94" cy="34" r="4" fill="#4f6fa8"/><circle cx="82" cy="51" r="4" fill="#4f6fa8"/>
      <path d="M73 36l7 12M91 36l-7 12" stroke="#4f6fa8" stroke-width="2.5"/>
      <text x="82" y="91" text-anchor="middle" fill="#173f34" font-size="18" font-weight="700">Route</text>
      <text x="82" y="116" text-anchor="middle" fill="#67766f" font-size="13">primary · support</text>
    </g>
    <g transform="translate(426 126)">
      <rect width="164" height="140" rx="18" fill="#ffffff" stroke="#c7ddd4"/>
      <circle cx="82" cy="42" r="23" fill="#f4ead4"/>
      <path d="M70 31h10v10H70zM84 31h10v10H84zM70 45h10v10H70zM84 45h10v10H84z" fill="none" stroke="#9a6b22" stroke-width="2"/>
      <text x="82" y="91" text-anchor="middle" fill="#173f34" font-size="18" font-weight="700">Equip</text>
      <text x="82" y="116" text-anchor="middle" fill="#67766f" font-size="13">memory · skills</text>
    </g>
    <g transform="translate(614 126)">
      <rect width="164" height="140" rx="18" fill="#ffffff" stroke="#c7ddd4"/>
      <circle cx="82" cy="42" r="23" fill="#f4e5e3"/>
      <path d="M70 48l16-16 8 8-16 16H70zM85 33l8 8" fill="none" stroke="#a9554b" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="82" y="91" text-anchor="middle" fill="#173f34" font-size="18" font-weight="700">Act</text>
      <text x="82" y="116" text-anchor="middle" fill="#67766f" font-size="13">tools · knowledge</text>
    </g>
    <g transform="translate(802 126)">
      <rect width="164" height="140" rx="18" fill="#ffffff" stroke="#c7ddd4"/>
      <circle cx="82" cy="42" r="23" fill="#e8e3f6"/>
      <path d="M68 32h28v18H82l-8 7v-7h-6z" fill="none" stroke="#7055a5" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="82" y="91" text-anchor="middle" fill="#173f34" font-size="18" font-weight="700">Compose</text>
      <text x="82" y="116" text-anchor="middle" fill="#67766f" font-size="13">merge · respond</text>
    </g>
    <g transform="translate(990 126)">
      <rect width="164" height="140" rx="18" fill="#ffffff" stroke="#c7ddd4"/>
      <circle cx="82" cy="42" r="23" fill="#dff0f3"/>
      <path d="M69 53V42M82 53V34M95 53V28" stroke="#317686" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="91" text-anchor="middle" fill="#173f34" font-size="18" font-weight="700">Observe</text>
      <text x="82" y="116" text-anchor="middle" fill="#67766f" font-size="13">trace · evaluate</text>
    </g>
  </g>

  <text x="600" y="337" text-anchor="middle" fill="#5b7a70" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">evaluation feedback informs the next iteration</text>
</svg>
